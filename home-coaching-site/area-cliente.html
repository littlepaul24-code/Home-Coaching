<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Area Cliente — Home Coaching</title><style>body{margin:0;background:#f6f7fb;color:#111;font:16px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text",Arial,sans-serif}.wrap{width:min(900px,calc(100% - 32px));margin:auto;padding:55px 0}.top{display:flex;justify-content:space-between;align-items:center;gap:20px}.brand{font-weight:900}.logout{border:1px solid #d2d2d7;background:#fff;border-radius:10px;padding:9px 13px;cursor:pointer}.card{background:#fff;border:1px solid #e2e3e8;border-radius:22px;padding:28px;margin-top:24px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.day{border:1px solid #e2e3e8;border-radius:16px;padding:18px}.day strong{display:block;font-size:20px}.status{color:#6e6e73;font-size:13px}@media(max-width:650px){.grid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}</style></head><body><main class="wrap"><div class="top"><div><div class="brand">HOME COACHING</div><h1 id="hello">Area personale</h1><p>La tua settimana di allenamento.</p></div><button id="logout" class="logout">ESCI</button></div><section class="card"><h2>SETTIMANA 1</h2><div class="grid"><div class="day"><strong>Giorno 1</strong><span class="status">Pronto</span></div><div class="day"><strong>Giorno 2</strong><span class="status">Pronto</span></div><div class="day"><strong>Giorno 3</strong><span class="status">Pronto</span></div></div></section></main><script type="module">import{requireRole,supabase}from './auth-common.js';const r=await requireRole('client','clienti.html');if(r){document.getElementById('hello').textContent='Ciao, '+r.profile.full_name+' 👋';}document.getElementById('logout').addEventListener('click',async()=>{await supabase.auth.signOut();location.href='clienti.html';});</script></body></html>
