<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Area Cliente — Home Coaching</title>
<style>
:root{--bg:#f5f5f7;--ink:#1d1d1f;--muted:#6e6e73;--line:#d2d2d7;--blue:#007aff;--green:#34c759;--purple:#af52de;--orange:#ff9500}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text",Arial,sans-serif}
.wrap{width:min(980px,calc(100% - 32px));margin:auto;padding:28px 0 70px}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:20px}.brand{font-weight:900;letter-spacing:-.4px}.muted{color:var(--muted)}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:850;cursor:pointer;background:var(--ink);color:#fff}.btn.secondary{background:#fff;color:var(--ink);border:1px solid var(--line)}.btn.green{background:var(--green)}
.hero{margin-top:22px;padding:26px;border-radius:24px;background:linear-gradient(135deg,#edf6ff,#f8f1ff);border:1px solid #e1e5ee}.hero h1{font-size:40px;line-height:1.05;letter-spacing:-2px;margin:8px 0}.hero p{margin:0;color:var(--muted)}
.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:20px;margin-top:18px}.days{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.day{border:1px solid var(--line);border-radius:16px;padding:18px;cursor:pointer;background:#fff;transition:.15s}.day:hover{transform:translateY(-1px);box-shadow:0 10px 28px rgba(0,0,0,.06)}.day.done{border-color:#b9dec2;background:#f4fbf5}.day h3{margin:0 0 6px}.pill{display:inline-block;margin-top:8px;padding:5px 9px;border-radius:999px;font-size:11px;font-weight:900;background:#eef4ff;color:#1468d6}.pill.done{background:#e8f7eb;color:#25743b}
.section{margin-top:18px}.block{border:1px solid var(--line);border-radius:18px;padding:18px;margin-top:12px;border-top:4px solid var(--blue);background:#fff}.block.green{border-top-color:var(--green)}.block.orange{border-top-color:var(--orange)}.block.purple{border-top-color:var(--purple)}.block h3{margin:0 0 4px}.block-meta{font-size:13px;color:var(--muted);margin-bottom:10px}.exercise{display:grid;grid-template-columns:1fr auto;gap:14px;padding:13px 0;border-top:1px solid #ececf0}.exercise:first-child{border-top:0}.exercise-name{font-weight:800}.exercise-meta{text-align:right;font-weight:750}.note{font-size:13px;color:var(--muted);margin-top:7px}.video{display:inline-block;margin-top:8px;color:var(--blue);text-decoration:none;font-weight:750;font-size:13px}
.complete{margin-top:18px;padding:18px;border:1px solid #cfe9d4;background:#f7fcf8;border-radius:18px}.complete strong{display:block;margin-bottom:7px}.complete-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:#fff;font:inherit}.full{grid-column:1/-1}.loading,.error{padding:30px;text-align:center;color:var(--muted)}.error{color:#a32119;background:#fff0ef;border-radius:14px}.back{border:0;background:none;padding:0;margin:0 0 8px;color:var(--blue);font-weight:800;cursor:pointer}
@media(max-width:700px){.days{grid-template-columns:1fr}.complete-grid{grid-template-columns:1fr}.exercise{grid-template-columns:1fr}.exercise-meta{text-align:left}}
</style>
</head>
<body>
<main class="wrap">
<header class="top"><div><div class="brand">HOME COACHING</div><div class="muted">AREA CLIENTE</div></div><button id="logout" class="btn secondary" type="button">ESCI</button></header>
<section id="app" class="loading">Sto caricando la tua area personale…</section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const sb=window.supabase.createClient('https://exhgrwelqwitxlfscybo.supabase.co','sb_publishable_efqq6jXmGTgdYidkIz55gw_PkwcOLH-');
const app=document.getElementById('app');
let user=null,profile=null,workouts=[],completions=[];
const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
function blockClass(c){return ['blue','green','orange','purple'].includes(c)?c:'blue'}
function prettySec(s){if(!s)return '';return s%60===0?`${s/60} min`:`${s} sec`}
async function init(){
 try{
   const {data:{user:u},error:ue}=await sb.auth.getUser(); if(ue)throw ue; if(!u){location.href='clienti.html';return} user=u;
   const {data:p,error:pe}=await sb.from('profiles').select('full_name,goal,level').eq('id',u.id).maybeSingle(); if(pe)throw pe; profile=p||{};
   const {data:w,error:we}=await sb.from('weekly_workouts').select('id,week_number,day_number,title,duration_minutes,published').eq('client_id',u.id).eq('week_number',1).eq('published',true).order('day_number'); if(we)throw we; workouts=w||[];
   const {data:c,error:ce}=await sb.from('workout_completions').select('id,workout_id,completed_at,feeling,notes').eq('client_id',u.id); if(ce)throw ce; completions=c||[];
   renderHome();
 }catch(e){console.error(e);app.innerHTML=`<div class="error"><strong>Non riesco a caricare il profilo.</strong><div style="margin-top:8px;font-size:13px">${esc(e.message||'Errore di collegamento')}</div></div>`}
}
function renderHome(){
 const doneIds=new Set(completions.map(c=>c.workout_id));
 const cards=[1,2,3].map(d=>{const w=workouts.find(x=>x.day_number===d);const done=w&&doneIds.has(w.id);return `<article class="day" data-day="${d}"><h3>Giorno ${d}</h3><div class="muted">${w?esc(w.title):'In preparazione'}</div>${w?`<div class="muted" style="margin-top:4px">${w.duration_minutes||50} minuti</div>`:''}<span class="pill ${done?'done':''}">${done?'✓ Completato':w?'Apri allenamento':'Non ancora pubblicato'}</span></article>`}).join('');
 app.innerHTML=`<section class="hero"><div class="muted">IL TUO PERCORSO</div><h1>Ciao, ${esc(profile?.full_name||'👋')} 👋</h1><p>${esc(profile?.goal||'Allenamento personalizzato')} · ${esc(profile?.level||'')}</p></section><section class="card"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center"><div><h2 style="margin:0">SETTIMANA 1</h2><p class="muted" style="margin:4px 0 0">Hai fino a 3 allenamenti. Puoi farli tutti oppure scegliere il tuo ritmo.</p></div></div><div class="days" style="margin-top:14px">${cards}</div></section>`;
 app.querySelectorAll('.day').forEach(el=>el.onclick=()=>openDay(Number(el.dataset.day)));
}
async function openDay(day){
 const w=workouts.find(x=>x.day_number===day); if(!w){return}
 app.innerHTML='<div class="loading">Sto caricando il workout…</div>';
 try{
   const {data:b,error:be}=await sb.from('workout_blocks').select('id,sort_order,block_type,title,sets,rest_seconds,notes,block_color,time_cap_seconds').eq('workout_id',w.id).order('sort_order'); if(be)throw be;
   const ids=(b||[]).map(x=>x.id); let ex=[]; if(ids.length){const {data:e,error:ee}=await sb.from('workout_exercises').select('id,block_id,sort_order,exercise_name,reps_text,duration_seconds,side,video_url,coach_notes,load_text,tempo').in('block_id',ids).order('sort_order'); if(ee)throw ee; ex=e||[]}
   const completion=completions.find(c=>c.workout_id===w.id);
   const blocks=(b||[]).map(block=>{const rows=ex.filter(x=>x.block_id===block.id);return `<section class="block ${blockClass(block.block_color)}"><h3>${esc(block.title)}</h3><div class="block-meta">${block.sets?`${block.sets} set · `:''}${block.rest_seconds?`recupero ${prettySec(block.rest_seconds)} · `:''}${block.time_cap_seconds?`time cap ${prettySec(block.time_cap_seconds)}`:''}</div>${block.notes?`<div class="note">${esc(block.notes)}</div>`:''}${rows.map(x=>{const meta=[x.reps_text,x.duration_seconds?prettySec(x.duration_seconds):'',x.side,x.load_text,x.tempo].filter(Boolean).join(' · ');return `<div class="exercise"><div><div class="exercise-name">${esc(x.exercise_name)}</div>${x.coach_notes?`<div class="note">${esc(x.coach_notes)}</div>`:''}${x.video_url?`<a class="video" href="${esc(x.video_url)}" target="_blank" rel="noopener">▶ Guarda il video</a>`:''}</div><div class="exercise-meta">${esc(meta)}</div></div>`}).join('')}</section>`}).join('');
   app.innerHTML=`<button id="back" class="back">← Torna agli allenamenti</button><section class="hero"><div class="muted">GIORNO ${day} · SETTIMANA 1</div><h1>${esc(w.title)}</h1><p>${w.duration_minutes||50} minuti</p></section>${blocks||'<div class="card"><div class="loading">Il workout non contiene ancora esercizi.</div></div>'}<section class="complete"><strong>${completion?'✓ Allenamento già completato':'Hai finito il workout?'}</strong>${completion?`<div class="muted">Completato il ${new Date(completion.completed_at).toLocaleString('it-IT')}</div>${completion.feeling?`<div style="margin-top:6px">Come è andata: <strong style="display:inline">${esc(completion.feeling)}</strong></div>`:''}${completion.notes?`<div class="note">${esc(completion.notes)}</div>`:''}`:`<div class="complete-grid"><select id="feeling" class="field"><option value="">Come è andata?</option><option>Facile</option><option>Giusta</option><option>Difficile</option><option>Molto difficile</option></select><input id="notes" class="field" placeholder="Note (facoltative)"><button id="complete" class="btn green full">✅ ALLENAMENTO COMPLETATO</button></div>`}</section>`;
   document.getElementById('back').onclick=renderHome;
   const cb=document.getElementById('complete'); if(cb)cb.onclick=()=>completeWorkout(w.id,day,cb);
 }catch(e){console.error(e);app.innerHTML=`<button id="back" class="back">← Torna agli allenamenti</button><div class="error">Errore nel caricamento del workout: ${esc(e.message||'errore')}</div>`;document.getElementById('back').onclick=renderHome}
}
async function completeWorkout(workoutId,day,btn){btn.disabled=true;btn.textContent='SALVATAGGIO…';try{const feeling=document.getElementById('feeling').value||null;const notes=document.getElementById('notes').value.trim()||null;const {data,error}=await sb.from('workout_completions').insert({workout_id:workoutId,client_id:user.id,feeling,notes}).select().single();if(error)throw error;completions.push(data);await openDay(day)}catch(e){alert('Non riesco a salvare il completamento: '+e.message);btn.disabled=false;btn.textContent='✅ ALLENAMENTO COMPLETATO'}}
document.getElementById('logout').onclick=async()=>{
  const button=document.getElementById('logout');
  button.disabled=true;
  button.textContent='USCITA…';
  try{ await sb.auth.signOut({scope:'global'}); }catch(e){ console.error('signOut',e); }
  try{
    for(let i=localStorage.length-1;i>=0;i--){
      const key=localStorage.key(i);
      if(key && (key.startsWith('sb-') || key.toLowerCase().includes('supabase'))){ localStorage.removeItem(key); }
    }
    sessionStorage.clear();
  }catch(e){ console.error('storage cleanup',e); }
  window.location.replace('clienti.html?logged_out='+Date.now());
};
window.addEventListener('pageshow', async (event)=>{
  if(event.persisted){
    try{
      const {data:{session}}=await sb.auth.getSession();
      if(!session) window.location.replace('clienti.html?logged_out='+Date.now());
    }catch(e){ console.error(e); }
  }
});
init();
</script>
</body></html>
