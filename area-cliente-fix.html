<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Area Cliente — Home Coaching</title>
<style>
body{margin:0;background:#f6f7fb;color:#111;font:16px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text",Arial,sans-serif}
.wrap{width:min(980px,calc(100% - 32px));margin:auto;padding:42px 0 70px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:20px}
.brand{font-weight:900;letter-spacing:-.5px}.muted{color:#6e6e73}
.logout{border:1px solid #d2d2d7;background:#fff;border-radius:10px;padding:10px 14px;cursor:pointer;font-weight:800}
.card{background:#fff;border:1px solid #e2e3e8;border-radius:22px;padding:28px;margin-top:24px}
.hero{padding:28px;border-radius:22px;background:linear-gradient(135deg,#eef6ff,#f8f3ff);border:1px solid #e1e5ee}
.hero h1{font-size:38px;line-height:1.05;letter-spacing:-2px;margin:8px 0}.hero p{margin:0;color:#6e6e73}
.progress{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.day{border:1px solid #e2e3e8;border-radius:16px;padding:18px;background:#fff}.day strong{display:block;font-size:20px}.day .status{display:inline-block;margin-top:8px;color:#6e6e73;font-size:13px}.day.done{border-color:#b9dec2;background:#f3fbf5}.day.done .status{color:#24723b;font-weight:800}
.loading{padding:40px;text-align:center;color:#6e6e73}.error{padding:16px;border-radius:12px;background:#fff0ef;color:#a32119;margin-top:18px}
@media(max-width:650px){.top{flex-direction:column}.progress{grid-template-columns:1fr}.hero h1{font-size:32px}}
</style>
</head>
<body>
<main class="wrap">
  <div class="top">
    <div><div class="brand">HOME COACHING</div><div class="muted">AREA CLIENTE</div></div>
    <button id="logout" class="logout" type="button">ESCI</button>
  </div>

  <section id="content" class="loading">Sto caricando la tua area personale…</section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://exhgrwelqwitxlfscybo.supabase.co';
const SUPABASE_KEY='sb_publishable_efqq6jXmGTgdYidkIz55gw_PkwcOLH-';
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const content=document.getElementById('content');

document.getElementById('logout').addEventListener('click',async()=>{
  await supabaseClient.auth.signOut();
  location.href='clienti.html';
});

(async()=>{
  try{
    const {data:{session},error:sessionError}=await supabaseClient.auth.getSession();
    if(sessionError) throw sessionError;
    if(!session){
      location.href='clienti.html';
      return;
    }

    const {data:profile,error:profileError}=await supabaseClient
      .from('profiles')
      .select('full_name,role,goal,level')
      .eq('id',session.user.id)
      .single();

    if(profileError) throw profileError;
    if(profile.role!=='client'){
      content.innerHTML='<div class="error">Questo accesso è riservato ai clienti.</div>';
      await supabaseClient.auth.signOut();
      return;
    }

    const {data:workouts,error:workoutError}=await supabaseClient
      .from('weekly_workouts')
      .select('id,day_number,title,duration_minutes,published')
      .eq('client_id',session.user.id)
      .eq('week_number',1)
      .order('day_number');

    if(workoutError) throw workoutError;

    const {data:completions,error:completionError}=await supabaseClient
      .from('workout_completions')
      .select('workout_id')
      .eq('client_id',session.user.id);

    if(completionError) throw completionError;
    const completed=new Set((completions||[]).map(x=>x.workout_id));

    const days=[1,2,3].map(day=>{
      const w=(workouts||[]).find(x=>x.day_number===day);
      const isDone=w && completed.has(w.id);
      if(!w) return `<article class="day"><strong>Giorno ${day}</strong><span class="status">Da programmare</span></article>`;
      return `<article class="day ${isDone?'done':''}"><strong>Giorno ${day}</strong><span class="status">${isDone?'✓ Completato':(w.published?'Pronto':'In preparazione')}</span>${w.title?`<div class="muted" style="margin-top:8px">${escapeHtml(w.title)}</div>`:''}${w.duration_minutes?`<div class="muted" style="font-size:12px;margin-top:3px">Max ${w.duration_minutes} minuti</div>`:''}</article>`;
    }).join('');

    content.innerHTML=`
      <section class="hero">
        <div class="muted">IL TUO PERCORSO</div>
        <h1>Ciao, ${escapeHtml(profile.full_name || '👋')} 👋</h1>
        <p>Questa è la tua area personale. Hai fino a 3 allenamenti programmati ogni settimana.</p>
      </section>
      <section class="card">
        <h2 style="margin-top:0">SETTIMANA 1</h2>
        <p class="muted">Completa gli allenamenti secondo il tuo ritmo: puoi farne 1, 2 oppure tutti e 3.</p>
        <div class="progress">${days}</div>
      </section>
    `;
  }catch(err){
    content.innerHTML='<div class="error">Non riesco a caricare la tua area personale. Se hai appena confermato l’account, esci e rientra da CLIENTI.</div>';
    console.error(err);
  }
})();

function escapeHtml(v){
  return String(v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
}
</script>
</body>
</html>
