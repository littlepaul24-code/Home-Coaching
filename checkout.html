<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pagamento — Home Coaching</title><style>body{margin:0;background:#f5f5f7;color:#1d1d1f;font:16px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text",Arial,sans-serif}.wrap{width:min(700px,calc(100% - 32px));margin:70px auto}.card{background:#fff;border:1px solid #d2d2d7;border-radius:24px;padding:32px}.amount{font-size:54px;font-weight:900;letter-spacing:-3px}.muted{color:#6e6e73}.btn{padding:15px 20px;border:0;border-radius:12px;background:#111;color:#fff;font-weight:900;cursor:pointer}.msg{margin-top:14px;font-weight:800}.plans{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:20px 0}.plan{padding:18px;border:1px solid #d2d2d7;border-radius:16px;cursor:pointer}.plan.active{border:2px solid #007aff;background:#f5f9ff}@media(max-width:600px){.plans{grid-template-columns:1fr}}</style></head><body><main class="wrap"><div class="card"><div style="font-weight:900">HOME COACHING</div><h1>Completa il tuo percorso.</h1><p class="muted">Scegli il piano e prosegui al checkout sicuro.</p><div class="plans" id="plans"></div><div id="chosen"></div><button class="btn" id="pay">CONTINUA AL PAGAMENTO →</button><div id="msg" class="msg"></div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
(()=>{
const URL='https://exhgrwelqwitxlfscybo.supabase.co';
const KEY='sb_publishable_efqq6jXmGTgdYidkIz55gw_PkwcOLH-';
const sb=window.supabase.createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const plans={monthly:['Mensile','59 €','al mese'],quarterly:['3 mesi','169 €','pagamento unico'],six_months:['6 mesi','329 €','pagamento unico'],annual:['12 mesi','629 €','pagamento unico']};
const msg=document.getElementById('msg');
let plan=new URLSearchParams(location.search).get('plan')||localStorage.getItem('hc_selected_plan')||'monthly';
if(!plans[plan]) plan='monthly';
function say(t,ok=false){msg.textContent=t;msg.style.color=ok?'#246536':'#a32119';}
function render(){
 document.getElementById('plans').innerHTML=Object.entries(plans).map(([k,v])=>`<div class="plan ${k===plan?'active':''}" data-p="${k}"><strong>${v[0]}</strong><div class="amount" style="font-size:32px">${v[1]}</div><div class="muted">${v[2]}</div></div>`).join('');
 document.querySelectorAll('.plan').forEach(x=>x.onclick=()=>{plan=x.dataset.p;localStorage.setItem('hc_selected_plan',plan);render();});
 document.getElementById('chosen').innerHTML=`<p><strong>Piano scelto:</strong> ${plans[plan][0]} — ${plans[plan][1]}</p>`;
}
render();
document.getElementById('pay').addEventListener('click',async()=>{
 const btn=document.getElementById('pay');
 btn.disabled=true;btn.textContent='APERTURA CHECKOUT…';say('');
 try{
   localStorage.setItem('hc_selected_plan',plan);
   const {data:{session},error:sessionError}=await sb.auth.getSession();
   if(sessionError) throw sessionError;
   if(!session){ window.location.href='clienti.html?checkout=1'; return; }
   const {data,error}=await sb.functions.invoke('create-checkout-v2',{body:{plan}});
   if(error) throw new Error(error.message||'Errore nella creazione del checkout.');
   if(!data?.url) throw new Error(data?.error||'Stripe non ha restituito il link di pagamento.');
   window.location.href=data.url;
 }catch(e){console.error('Checkout error',e);say(e?.message||String(e)||'Errore imprevisto.');btn.disabled=false;btn.textContent='CONTINUA AL PAGAMENTO →';}
});
})();
</script></body></html>
