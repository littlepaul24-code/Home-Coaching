<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pagamento — Home Coaching</title><style>body{margin:0;background:#f5f5f7;color:#1d1d1f;font:16px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text",Arial,sans-serif}.wrap{width:min(700px,calc(100% - 32px));margin:70px auto}.card{background:#fff;border:1px solid #d2d2d7;border-radius:24px;padding:32px}.amount{font-size:54px;font-weight:900;letter-spacing:-3px}.muted{color:#6e6e73}.btn{padding:15px 20px;border:0;border-radius:12px;background:#111;color:#fff;font-weight:900;cursor:pointer}.msg{margin-top:14px;font-weight:800}.plans{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:20px 0}.plan{padding:18px;border:1px solid #d2d2d7;border-radius:16px;cursor:pointer}.plan.active{border:2px solid #007aff;background:#f5f9ff}@media(max-width:600px){.plans{grid-template-columns:1fr}}</style></head><body><main class="wrap"><div class="card"><div style="font-weight:900">HOME COACHING</div><h1>Completa il tuo percorso.</h1><p class="muted">Scegli il piano e prosegui al checkout sicuro.</p><div class="plans" id="plans"></div><div id="chosen"></div><button class="btn" id="pay">CONTINUA AL PAGAMENTO →</button><div id="msg" class="msg"></div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const URL='https://exhgrwelqwitxlfscybo.supabase.co',KEY='sb_publishable_efqq6jXmGTgdYidkIz55gw_PkwcOLH-';const sb=supabase.createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true}});const plans={monthly:['Mensile','59 €','al mese'],quarterly:['3 mesi','169 €','pagamento unico'],six_months:['6 mesi','329 €','pagamento unico'],annual:['12 mesi','629 €','pagamento unico']};let plan=new URLSearchParams(location.search).get('plan')||localStorage.getItem('hc_selected_plan')||'monthly'; if(plan==='semestrale') plan='six_months';function render(){document.getElementById('plans').innerHTML=Object.entries(plans).map(([k,v])=>`<div class="plan ${k===plan?'active':''}" data-p="${k}"><strong>${v[0]}</strong><div class="amount" style="font-size:32px">${v[1]}</div><div class="muted">${v[2]}</div></div>`).join('');document.querySelectorAll('.plan').forEach(x=>x.onclick=()=>{plan=x.dataset.p;localStorage.setItem('hc_selected_plan',plan);render()});document.getElementById('chosen').innerHTML=`<p><strong>Piano scelto:</strong> ${plans[plan][0]} — ${plans[plan][1]}</p>`}render();document.getElementById('pay').onclick=async()=>{const msg=document.getElementById('msg');msg.textContent='Apro Stripe…';try{const {data:{session}}=await sb.auth.getSession();if(!session){localStorage.setItem('hc_selected_plan',plan);location.href='clienti.html?checkout=1';return;}const r=await fetch(URL+'/functions/v1/create-checkout-v2',{method:'POST',headers:{'Content-Type':'application/json','apikey':KEY,'Authorization':'Bearer '+session.access_token},body:JSON.stringify({plan})});const d=await r.json();if(!r.ok||!d.url)throw new Error(d?.error||'Impossibile creare il checkout.');location.href=d.url}catch(e){msg.textContent=e.message}};</script></body></html>
