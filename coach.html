<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Coach — Home Coaching</title><style>:root{--bg:#f6f5fb;--ink:#1d1d1f;--muted:#6e6e73;--line:#d2d2d7;--purple:#5856d6}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#faf7ff,#fff,#f1f7ff);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text",Arial,sans-serif}.wrap{width:min(520px,calc(100% - 32px));margin:auto;padding:70px 0}.brand{font-weight:900;letter-spacing:-.5px;margin-bottom:50px}.card{background:#fff;border:1px solid var(--line);border-radius:26px;padding:32px;box-shadow:0 20px 55px rgba(0,0,0,.07)}h1{font-size:44px;line-height:1;margin:0 0 10px;letter-spacing:-2px}.tag{color:var(--purple);font-weight:800;font-size:12px;letter-spacing:1.5px}p{color:var(--muted)}.field{margin:18px 0}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:7px}.field input{width:100%;padding:14px;border:1px solid var(--line);border-radius:12px;font:inherit;box-sizing:border-box}.btn{width:100%;padding:15px;border:0;border-radius:12px;background:#111;color:#fff;font-weight:900;cursor:pointer}.btn:disabled{opacity:.55}.back{display:inline-block;margin-top:18px;color:var(--purple);font-weight:700;font-size:14px}.note{font-size:12px;color:#8a8a8f;margin-top:14px}.msg{margin-top:14px;font-size:14px;font-weight:700}</style></head><body><main class="wrap"><div class="brand">HOME COACHING</div><div class="card"><div class="tag">AREA COACH</div><h1>Accesso coach.</h1><p>Area riservata per la gestione dei clienti e dei programmi.</p><form id="loginForm"><div class="field"><label for="email">Email</label><input id="email" type="email" autocomplete="email" required></div><div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required></div><button id="submit" class="btn" type="submit">ACCEDI →</button><div id="msg" class="msg"></div></form><div class="note">Solo gli account con ruolo <strong>coach</strong> possono accedere a quest'area.</div><a class="back" href="index.html">← Torna alla Home</a></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const sb=window.supabase.createClient('https://exhgrwelqwitxlfscybo.supabase.co','sb_publishable_efqq6jXmGTgdYidkIz55gw_PkwcOLH-');const form=document.getElementById('loginForm'),btn=document.getElementById('submit'),msg=document.getElementById('msg');form.addEventListener('submit',async e=>{e.preventDefault();btn.disabled=true;btn.textContent='ACCESSO…';msg.textContent='';try{await sb.auth.signOut();const{data,error}=await sb.auth.signInWithPassword({email:document.getElementById('email').value.trim().toLowerCase(),password:document.getElementById('password').value});if(error)throw error;const{data:p,error:pe}=await sb.from('profiles').select('role').eq('id',data.user.id).maybeSingle();if(pe)throw pe;if(p?.role!=='coach'){await sb.auth.signOut();throw new Error('ACCOUNT_NOT_COACH')}window.location.replace('area-coach.html')}catch(err){msg.textContent=err.message==='ACCOUNT_NOT_COACH'?'Questo account non è autorizzato come Coach.':'Email o password non corrette, oppure email non ancora confermata.';btn.disabled=false;btn.textContent='ACCEDI →'}});</script></body></html>
