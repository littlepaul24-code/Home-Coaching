<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Clienti — Home Coaching</title>
<style>:root{--bg:#f5f5f7;--ink:#1d1d1f;--muted:#6e6e73;--line:#d2d2d7;--blue:#007aff;--red:#ff3b30}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#f7fbff,#fff,#f7f0ff);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text",Arial,sans-serif}.wrap{width:min(520px,calc(100% - 32px));margin:auto;padding:70px 0}.brand{font-weight:900;letter-spacing:-.5px;margin-bottom:50px}.card{background:#fff;border:1px solid var(--line);border-radius:26px;padding:32px;box-shadow:0 20px 55px rgba(0,0,0,.07)}h1{font-size:44px;line-height:1;margin:0 0 10px;letter-spacing:-2px}.tag{color:var(--blue);font-weight:800;font-size:12px;letter-spacing:1.5px}p{color:var(--muted)}.field{margin:18px 0}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:7px}.field input{width:100%;padding:14px;border:1px solid var(--line);border-radius:12px;font:inherit}.btn{width:100%;padding:15px;border:0;border-radius:12px;background:#111;color:#fff;font-weight:900;cursor:pointer}.btn:disabled{opacity:.55}.back{display:inline-block;margin-top:18px;color:var(--blue);font-weight:700;font-size:14px}.linkbtn{display:block;margin-top:14px;background:none;border:0;color:var(--blue);font-weight:800;cursor:pointer;padding:0}.msg{margin-top:14px;min-height:20px;font-size:14px;font-weight:700}</style></head>
<body><main class="wrap"><div class="brand">HOME COACHING</div><div class="card"><div class="tag">AREA CLIENTI</div><h1>Accedi.</h1><p>Entra nel tuo percorso personale.</p><div class="field"><label for="email">Email</label><input id="email" type="email" autocomplete="username" inputmode="email"></div><div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password"></div><button id="submit" class="btn" type="button">ACCEDI →</button><button id="forgot" class="linkbtn" type="button">Password dimenticata?</button><div id="msg" class="msg" role="status" aria-live="polite"></div><a class="back" href="index.html">← Torna alla Home</a></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
(()=>{const URL='https://exhgrwelqwitxlfscybo.supabase.co';const KEY='sb_publishable_efqq6jXmGTgdYidkIz55gw_PkwcOLH-';const btn=document.getElementById('submit'),forgot=document.getElementById('forgot'),emailEl=document.getElementById('email'),passEl=document.getElementById('password'),msg=document.getElementById('msg');let sb;try{sb=window.supabase.createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}})}catch(e){}
const say=(t,ok=false)=>{msg.textContent=t;msg.style.color=ok?'#246536':'#a32119'};
async function go(){const email=emailEl.value.trim().toLowerCase(),password=passEl.value;if(!email||!password)return say('Inserisci email e password.');if(!sb)return say('Servizio di accesso non disponibile.');btn.disabled=true;btn.textContent='ACCESSO…';say('');try{await sb.auth.signOut({scope:'global'});const r=await fetch(URL+'/auth/v1/token?grant_type=password',{method:'POST',headers:{'Content-Type':'application/json','apikey':KEY},body:JSON.stringify({email,password})});const d=await r.json();if(!r.ok||!d.access_token)throw new Error(d?.error_description||'Email o password non corrette.');const {error}=await sb.auth.setSession({access_token:d.access_token,refresh_token:d.refresh_token});if(error)throw error;const {data:{session}}=await sb.auth.getSession();if(!session)throw new Error('Sessione non disponibile.');const plan=localStorage.getItem('hc_selected_plan');say('✓ Accesso effettuato…',true);setTimeout(()=>window.location.replace(plan?`checkout.html?plan=${encodeURIComponent(plan)}`:'area-cliente.html?login='+Date.now()),180)}catch(e){say(/not confirmed/i.test(e.message)?'Devi prima confermare la tua email. Controlla la posta.':e.message||'Accesso non riuscito.')}finally{btn.disabled=false;btn.textContent='ACCEDI →'}}
btn.onclick=go;passEl.addEventListener('keydown',e=>{if(e.key==='Enter')go()});forgot.onclick=async()=>{const email=emailEl.value.trim().toLowerCase();if(!email)return say('Inserisci prima la tua email.');try{const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname.replace('clienti.html','reset-password.html')});if(error)throw error;say('Ti abbiamo inviato il link per reimpostare la password. Controlla la posta.',true)}catch(e){say(e.message||'Non riesco a inviare il link.')}};
})();</script></body></html>
