<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Clienti — Home Coaching</title><style>body{margin:0;background:linear-gradient(135deg,#f7fbff,#fff,#f7f0ff);color:#1d1d1f;font:16px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text",Arial,sans-serif}.wrap{width:min(520px,calc(100% - 32px));margin:auto;padding:80px 0}.brand{font-weight:900;letter-spacing:-.5px;margin-bottom:50px}.card{background:#fff;border:1px solid #d2d2d7;border-radius:26px;padding:32px;box-shadow:0 20px 55px rgba(0,0,0,.07)}h1{font-size:44px;line-height:1;margin:0 0 10px;letter-spacing:-2px}p{color:#6e6e73}.field{margin:18px 0}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:7px}.field input{width:100%;padding:14px;border:1px solid #d2d2d7;border-radius:12px;font:inherit;box-sizing:border-box}.btn{width:100%;padding:15px;border:0;border-radius:12px;background:#111;color:#fff;font-weight:900;cursor:pointer}.btn:disabled{opacity:.55}.back{display:inline-block;margin-top:18px;color:#007aff;font-weight:700;font-size:14px}.msg{margin-top:14px;font-size:14px;font-weight:700}.loading{opacity:.7}</style></head><body><main class="wrap"><div class="brand">HOME COACHING</div><div class="card"><div style="color:#007aff;font-weight:800;font-size:12px;letter-spacing:1.5px">AREA CLIENTI</div><h1>Accedi.</h1><p>Entra nel tuo percorso personale.</p><form id="loginForm"><div class="field"><label for="email">Email</label><input id="email" type="email" autocomplete="email" required></div><div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required></div><button id="submit" class="btn" type="submit">ACCEDI →</button><div id="msg" class="msg"></div></form><a class="back" href="index.html">← Torna alla Home</a></div></main><script type="module">import{supabase}from './auth-common.js';const form=document.getElementById('loginForm'),btn=document.getElementById('submit'),msg=document.getElementById('msg');async function boot(){const{data:{session}}=await supabase.auth.getSession();if(session){const{data:p}=await supabase.from('profiles').select('role').eq('id',session.user.id).maybeSingle();if(p?.role==='client')location.href='area-cliente.html';}}boot();form.addEventListener('submit',async e=>{e.preventDefault();btn.disabled=true;btn.textContent='ACCESSO…';msg.textContent='';const{data,error}=await supabase.auth.signInWithPassword({email:email.value.trim(),password:password.value});if(error){msg.textContent='Email o password non corrette.';btn.disabled=false;btn.textContent='ACCEDI →';return}const{data:p}=await supabase.from('profiles').select('role').eq('id',data.user.id).single();if(p?.role!=='client'){await supabase.auth.signOut();msg.textContent='Questo account non è un account cliente.';btn.disabled=false;btn.textContent='ACCEDI →';return}location.href='area-cliente.html';});</script></body></html>
