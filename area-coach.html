<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Area Coach — Home Coaching</title><style>:root{--bg:#f5f5f7;--ink:#1d1d1f;--muted:#6e6e73;--line:#d2d2d7;--blue:#007aff;--green:#34c759;--purple:#af52de;--orange:#ff9500;--red:#ff3b30}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text",Arial,sans-serif}.wrap{width:min(1180px,calc(100% - 32px));margin:auto;padding:34px 0 70px}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:20px}.brand{font-weight:900}.muted{color:var(--muted)}button,input,select,textarea{font:inherit}.btn{border:0;border-radius:11px;padding:11px 15px;font-weight:800;cursor:pointer;background:var(--ink);color:#fff}.btn.secondary{background:#fff;color:var(--ink);border:1px solid var(--line)}.btn.blue{background:var(--blue)}.layout{display:grid;grid-template-columns:300px 1fr;gap:18px;margin-top:20px}.panel,.block{background:#fff;border:1px solid var(--line);border-radius:20px;padding:20px}.client{padding:13px;border:1px solid var(--line);border-radius:12px;margin-top:8px;cursor:pointer}.client.active{border:2px solid var(--blue);background:#f4f8ff}.day-tabs{display:flex;gap:8px;margin:15px 0;flex-wrap:wrap}.day-tab{padding:10px 13px;border:1px solid var(--line);border-radius:10px;background:#fff;font-weight:800;cursor:pointer}.day-tab.active{background:var(--ink);color:#fff}.editor-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}.title-input{font-size:30px;font-weight:900;border:1px solid transparent;padding:4px 7px;width:100%}.title-input:focus{border-color:var(--line);outline:none;border-radius:10px}.block{margin-top:15px;border-top:4px solid var(--blue)}.block.green{border-top-color:var(--green)}.block.orange{border-top-color:var(--orange)}.block.purple{border-top-color:var(--purple)}.block-head{display:grid;grid-template-columns:1.3fr .8fr .65fr .8fr auto;gap:8px;align-items:center}.field{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:#fff}.notes{margin-top:9px;min-height:55px}.rows{margin-top:13px}.row{display:grid;grid-template-columns:26px 1.25fr .7fr .6fr .7fr .7fr 1fr auto;gap:7px;align-items:center;padding:8px 0;border-top:1px solid #ececf0}.row-actions{display:flex;gap:4px;flex-wrap:wrap}.mini{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 8px;cursor:pointer}.savebar{position:sticky;bottom:14px;background:rgba(255,255,255,.94);backdrop-filter:blur(14px);border:1px solid var(--line);padding:12px;border-radius:16px;display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:18px}.status{font-weight:800}.empty{padding:35px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:16px}.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#eef4ff;color:#1468d6;font-weight:900;font-size:11px}.modal{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;padding:20px}.modal.open{display:flex}.modal-card{background:#fff;border-radius:20px;padding:22px;width:min(680px,100%);max-height:85vh;overflow:auto}.exercise-option{padding:11px;border:1px solid var(--line);border-radius:10px;margin-top:7px;cursor:pointer}.exercise-option:hover{background:#f5f5f7}.error{padding:15px;border-radius:12px;background:#fff0ef;color:#a32119;margin-top:12px}@media(max-width:900px){.layout{grid-template-columns:1fr}.block-head{grid-template-columns:1fr 1fr}.row{grid-template-columns:24px 1fr 1fr 1fr}.row .optional{display:none}}@media(max-width:600px){.top,.editor-head{flex-direction:column}.title-input{font-size:25px}.savebar{flex-direction:column;align-items:stretch}}</style></head><body><main class="wrap"><div class="top"><div><div class="brand">HOME COACHING · COACH</div><h1>Area Coach</h1><p class="muted">Gestisci clienti, settimane e workout.</p></div><button id="logout" class="btn secondary">ESCI</button></div><div class="toolbar" style="margin-top:20px;display:flex;gap:9px;flex-wrap:wrap"><button class="btn secondary" id="demoBtn">MODALITÀ PROVA</button><span class="badge" id="modeBadge">LIVE SUPABASE</span></div><div class="layout"><aside class="panel"><h2 style="margin-top:0">Clienti</h2><div id="clients"><div class="empty">Caricamento…</div></div></aside><section><div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><label style="font-weight:800">Settimana <select id="weekSelect" class="field" style="width:auto"></select></label><button id="dupWeek" class="btn secondary" type="button">DUPLICA SETTIMANA PRECEDENTE</button><button id="showCheckins" class="btn secondary" type="button">CHECK-IN</button></div><section id="checkinPanel" class="panel" style="display:none;margin-top:12px"></section><div class="day-tabs"><button class="day-tab active" data-day="1">Giorno 1</button><button class="day-tab" data-day="2">Giorno 2</button><button class="day-tab" data-day="3">Giorno 3</button></div><div id="editor"><div class="empty">Seleziona un cliente oppure usa Modalità Prova.</div></div></section></div></main><div class="modal" id="exerciseModal"><div class="modal-card"><div class="editor-head"><h2>Sostituisci esercizio</h2><button class="mini" id="closeModal">✕</button></div><p class="muted">Cerca e scegli dalla libreria esercizi.</p><input id="exerciseSearch" class="field" placeholder="Cerca esercizio…"><div id="exerciseList"></div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const sb=window.supabase.createClient('https://exhgrwelqwitxlfscybo.supabase.co','sb_publishable_efqq6jXmGTgdYidkIz55gw_PkwcOLH-');
const state={mode:'live',clients:[],selectedClient:null,day:1,week:1,workout:null,blocks:[],library:[],editIndex:null};
const demoLibrary=[
['Air Squat','Bodyweight','15'],['Jump Squat','Bodyweight','10'],['Split Squat','Bodyweight','10 per side'],['Bulgarian Squat','Bodyweight','10 per side'],['Reverse Lunge','Bodyweight','10 per side'],['Walking Lunge','Bodyweight','20'],['Lateral Lunge','Bodyweight','10 per side'],['Curtsy Lunge','Bodyweight','10 per side'],['Cossack Squat','Bodyweight','8 per side'],['Pistol Squat','Bodyweight','5 per side'],['Calf Raise','Bodyweight','20'],['Single Leg Calf Raise','Bodyweight','15 per side'],['Glute Bridge','Bodyweight','15'],['Single Leg Glute Bridge','Bodyweight','10 per side'],['Hip Thrust','Bodyweight','15'],['Donkey Kick','Bodyweight','15 per side'],['Fire Hydrant','Bodyweight','15 per side'],['Tuck Up','Core','10'],['V Up','Core','10'],['Sit Up','Core','15'],['Crunch','Core','20'],['Reverse Crunch','Core','15'],['Bicycle Crunch','Core','20'],['Dead Bug','Core','10 per side'],['Bird Dog','Core','10 per side'],['Hollow Hold','Core','','20'],['Hollow Rock','Core','15'],['Plank','Core','','30'],['Side Plank','Core','','20'],['Mountain Climber','Conditioning','20'],['Burpee','Conditioning','10'],['Squat Thrust','Conditioning','10'],['Bear Crawl','Conditioning','','20'],['Crab Walk','Conditioning','','20'],['Inchworm','Mobility','6'],['Push Up','Upper Body','10'],['Knee Push Up','Upper Body','10'],['Diamond Push Up','Upper Body','8'],['Wide Push Up','Upper Body','10'],['Pike Push Up','Upper Body','8'],['Archer Push Up','Upper Body','6 per side'],['Scapular Push Up','Upper Body','12'],['Superman','Posterior Chain','12'],['Superman Hold','Posterior Chain','','20'],['Reverse Snow Angel','Posterior Chain','10'],['Cat Cow','Mobility','10'],['Downward Dog','Mobility','','30'],['Jumping Jack','Conditioning','20'],['High Knees','Conditioning','','20'],['Butt Kicks','Conditioning','','20'],['Skater Jump','Conditioning','20'],['Broad Jump','Conditioning','6'],['Tuck Jump','Conditioning','8'],['Split Jump','Conditioning','10'],['Fast Feet','Conditioning','','20']
].map(x=>({name:x[0],category:x[1],default_reps_text:x[2]||'',default_duration_seconds:x[3]?Number(x[3]):null}));

{title:'CORE WORK',block_type:'core',sets:4,rest_seconds:40,notes:'REST 40” tra un set e l’altro',block_color:'blue',exercises:[['Tuck Up','10',''],['Hollow Hold','','15'],['Tuck Up','10',''],['Hollow Hold','','15']]},
{title:'BULGARIAN SQUAT',block_type:'strength',sets:3,rest_seconds:60,notes:'REST MAX 1’ tra un set e l’altro',block_color:'green',exercises:[['Bulgarian Squat','15','']]},
{title:'WOD',block_type:'wod',sets:null,rest_seconds:null,notes:'AMRAP 10’',block_color:'orange',time_cap_seconds:600,exercises:[['Lunge','15',''],['Burpee','10',''],['Sit Up','20',''],['Air Squat','30',''],['Lunge','15','']]}
]},2:null,3:null};
function esc(v=''){return String(v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
function renderClients(){const c=document.getElementById('clients');if(!state.clients.length){c.innerHTML='<div class="empty">Nessun cliente.</div>';return}c.innerHTML=state.clients.map((x,i)=>`<div class="client ${state.selectedClient?.id===x.id?'active':''}" data-i="${i}"><strong>${esc(x.full_name||'Senza nome')}</strong><div class="muted">${esc(x.goal||'')} · ${esc(x.level||'')}</div></div>`).join('');c.querySelectorAll('.client').forEach(e=>e.onclick=()=>selectClient(state.clients[+e.dataset.i]));}
async function ensureCoach(){const{data:{session}}=await sb.auth.getSession();if(!session)throw new Error('NOT_AUTH');const{data:p,error}=await sb.from('profiles').select('role').eq('id',session.user.id).maybeSingle();if(error)throw error;if(p?.role!=='coach')throw new Error('NOT_COACH');return session;}
async function loadClients(){try{await ensureCoach();const{data,error}=await sb.from('profiles').select('id,full_name,goal,level,role').eq('role','client').order('full_name');if(error)throw error;state.clients=data||[];renderClients();}catch(e){document.getElementById('clients').innerHTML='<div class="error">Area riservata: devi entrare come Coach.</div>';console.error(e);}}
async function selectClient(c){state.selectedClient=c;state.mode='live';document.getElementById('modeBadge').textContent='LIVE SUPABASE';renderClients();await loadDay();}
async function loadDay(){const ed=document.getElementById('editor');ed.innerHTML='<div class="empty">Caricamento workout…</div>';try{const{data:w,error:we}=await sb.from('weekly_workouts').select('*').eq('client_id',state.selectedClient.id).eq('week_number',state.week).eq('day_number',state.day).maybeSingle();if(we)throw we;if(!w){ed.innerHTML=`<div class="empty">Il Settimana ${state.week} · Giorno ${state.day} non esiste ancora.<br><button class="btn blue" id="createDay" style="margin-top:12px">CREA GIORNO ${state.day}</button></div>`;document.getElementById('createDay').onclick=createDay;return}state.workout=w;const{data:b,error:be}=await sb.from('workout_blocks').select('*').eq('workout_id',w.id).order('sort_order');if(be)throw be;state.blocks=[];for(const block of (b||[])){const{data:ex,error:ee}=await sb.from('workout_exercises').select('*').eq('block_id',block.id).order('sort_order');if(ee)throw ee;state.blocks.push({...block,color:block.block_color||'blue',exercises:ex||[]});}renderEditor();}catch(e){ed.innerHTML=`<div class="error">Errore: ${esc(e.message)}</div>`;console.error(e);}}
async function createDay(){const btn=document.getElementById('createDay');if(btn){btn.disabled=true;btn.textContent='CREAZIONE…'}try{const payload={client_id:state.selectedClient.id,week_number:state.week,day_number:state.day,title:`GIORNO ${state.day}`,duration_minutes:50,published:false};const{data,error}=await sb.from('weekly_workouts').insert(payload).select().single();if(error)throw error;state.workout=data;state.blocks=[];renderEditor();}catch(e){alert(`Impossibile creare Settimana ${state.week} · Giorno ${state.day}: ${e.message}`);if(btn){btn.disabled=false;btn.textContent=`CREA GIORNO ${state.day}`}}}
function renderEditor(){const ed=document.getElementById('editor');ed.innerHTML=`<div class="panel"><div class="editor-head"><div style="flex:1"><div class="muted">${esc(state.selectedClient.full_name)} · SETTIMANA 1 · GIORNO ${state.day}</div><input id="workoutTitle" class="title-input" value="${esc(state.workout.title)}"></div><div><label class="muted" style="display:block;font-size:12px">Durata minuti</label><input id="workoutDuration" class="field" type="number" min="1" value="${state.workout.duration_minutes||50}" style="width:120px"></div></div><div class="toolbar" style="display:flex;gap:9px;flex-wrap:wrap;margin-top:16px"><button class="btn blue" id="addBlock">+ AGGIUNGI BLOCCO</button><button class="btn secondary" id="publish">${state.workout.published?'RIPUBBLICA':'PUBBLICA'}</button></div></div>${state.blocks.length?state.blocks.map((b,i)=>blockHTML(b,i)).join(''):'<div class="empty" style="margin-top:15px">Nessun blocco. Aggiungine uno.</div>'}<div class="savebar"><span id="saveStatus" class="status muted">Modifiche non salvate</span><button id="saveAll" class="btn blue">SALVA TUTTO</button></div>`;document.getElementById('addBlock').onclick=()=>{state.blocks.push({title:'NUOVO BLOCCO',block_type:'other',sets:1,rest_seconds:null,notes:'',block_color:'purple',time_cap_seconds:null,exercises:[]});renderEditor()};document.getElementById('saveAll').onclick=saveAll;document.getElementById('publish').onclick=async()=>{
  const status=document.getElementById('saveStatus');
  if(status) status.textContent='Pubblicazione…';
  try{
    state.workout.published=true;
    await saveAll();
    const {data:check,error:ce}=await sb.from('weekly_workouts').select('published').eq('id',state.workout.id).single();
    if(ce) throw ce;
    if(!check?.published) throw new Error('Il workout non risulta pubblicato nel database.');
    if(status) status.textContent='✓ Pubblicato';
    alert(`Settimana ${state.week} · Giorno ${state.day} pubblicato. Ora è visibile al cliente.`);
  }catch(e){
    state.workout.published=false;
    if(status) status.textContent='Errore pubblicazione';
    alert('Pubblicazione non riuscita: '+e.message);
  }
};document.getElementById('workoutTitle').oninput=e=>state.workout.title=e.target.value;document.getElementById('workoutDuration').oninput=e=>state.workout.duration_minutes=Number(e.target.value)||50;attachEvents();}
function blockHTML(b,i){return `<section class="block ${b.color||'blue'}" data-block="${i}"><div class="block-head"><input class="field b-title" value="${esc(b.title)}"><select class="field b-type"><option value="core" ${b.block_type==='core'?'selected':''}>Core</option><option value="strength" ${b.block_type==='strength'?'selected':''}>Strength</option><option value="wod" ${b.block_type==='wod'?'selected':''}>WOD</option><option value="other" ${b.block_type==='other'?'selected':''}>Altro</option></select><input class="field b-sets" type="number" min="0" placeholder="Set" value="${b.sets??''}"><input class="field b-rest" type="number" min="0" placeholder="Rest sec" value="${b.rest_seconds??''}"><div class="row-actions"><button class="mini up">↑</button><button class="mini down">↓</button><button class="mini del">✕</button></div></div><textarea class="field notes b-notes" placeholder="Note del blocco…">${esc(b.notes||'')}</textarea><div class="rows">${b.exercises?.length?b.exercises.map((x,j)=>rowHTML(x,j)).join(''):'<div class="muted" style="padding:10px 0">Nessun esercizio.</div>'}</div><button class="btn secondary add-ex" style="margin-top:12px">+ AGGIUNGI ESERCIZIO</button></section>`}
function rowHTML(x,j){return `<div class="row" data-row="${j}"><div class="muted">☷</div><input class="field ex-name" value="${esc(x.exercise_name)}"><input class="field ex-reps" placeholder="Reps" value="${esc(x.reps_text||'')}"><input class="field ex-sec" type="number" min="0" placeholder="Sec" value="${x.duration_seconds??''}"><input class="field ex-side optional" placeholder="Lato" value="${esc(x.side||'')}"><input class="field ex-load optional" placeholder="Carico" value="${esc(x.load_text||'')}"><input class="field ex-tempo optional" placeholder="Tempo" value="${esc(x.tempo||'')}"><div class="row-actions"><button class="mini replace">Sostituisci</button><button class="mini upR">↑</button><button class="mini downR">↓</button><button class="mini delR">✕</button></div></div>`}
function attachEvents(){document.querySelectorAll('[data-block]').forEach(el=>{const i=+el.dataset.block,b=state.blocks[i];el.querySelector('.b-title').oninput=e=>b.title=e.target.value;el.querySelector('.b-type').onchange=e=>b.block_type=e.target.value;el.querySelector('.b-sets').oninput=e=>b.sets=e.target.value?Number(e.target.value):null;el.querySelector('.b-rest').oninput=e=>b.rest_seconds=e.target.value?Number(e.target.value):null;el.querySelector('.b-notes').oninput=e=>b.notes=e.target.value;el.querySelector('.up').onclick=()=>{if(i>0){[state.blocks[i-1],state.blocks[i]]=[state.blocks[i],state.blocks[i-1]];renderEditor()}};el.querySelector('.down').onclick=()=>{if(i<state.blocks.length-1){[state.blocks[i+1],state.blocks[i]]=[state.blocks[i],state.blocks[i+1]];renderEditor()}};el.querySelector('.del').onclick=()=>{if(confirm('Eliminare il blocco?')){state.blocks.splice(i,1);renderEditor()}};el.querySelector('.add-ex').onclick=()=>{b.exercises.push({exercise_name:'Nuovo esercizio',reps_text:'',duration_seconds:null,side:'',video_url:'',coach_notes:'',load_text:'',tempo:''});renderEditor()};el.querySelectorAll('.row').forEach(row=>{const j=+row.dataset.row,x=b.exercises[j];row.querySelector('.ex-name').oninput=e=>x.exercise_name=e.target.value;row.querySelector('.ex-reps').oninput=e=>x.reps_text=e.target.value;row.querySelector('.ex-sec').oninput=e=>x.duration_seconds=e.target.value?Number(e.target.value):null;row.querySelector('.ex-side').oninput=e=>x.side=e.target.value;row.querySelector('.ex-load').oninput=e=>x.load_text=e.target.value;row.querySelector('.ex-tempo').oninput=e=>x.tempo=e.target.value;row.querySelector('.replace').onclick=()=>openModal(i,j);row.querySelector('.upR').onclick=()=>{if(j>0){[b.exercises[j-1],b.exercises[j]]=[b.exercises[j],b.exercises[j-1]];renderEditor()}};row.querySelector('.downR').onclick=()=>{if(j<b.exercises.length-1){[b.exercises[j+1],b.exercises[j]]=[b.exercises[j],b.exercises[j+1]];renderEditor()}};row.querySelector('.delR').onclick=()=>{b.exercises.splice(j,1);renderEditor()}})})}
async function saveAll(){const status=document.getElementById('saveStatus');if(status)status.textContent='Salvataggio…';try{const{error:we}=await sb.from('weekly_workouts').update({title:state.workout.title,duration_minutes:state.workout.duration_minutes,published:!!state.workout.published}).eq('id',state.workout.id);if(we)throw we;for(let i=0;i<state.blocks.length;i++){const b=state.blocks[i];let bid=b.id;if(!bid){const{data,error}=await sb.from('workout_blocks').insert({workout_id:state.workout.id,sort_order:i+1,block_type:b.block_type,title:b.title,sets:b.sets,rest_seconds:b.rest_seconds,notes:b.notes,block_color:b.block_color||b.color,time_cap_seconds:b.time_cap_seconds}).select().single();if(error)throw error;bid=data.id;b.id=bid}else{const{error}=await sb.from('workout_blocks').update({sort_order:i+1,block_type:b.block_type,title:b.title,sets:b.sets,rest_seconds:b.rest_seconds,notes:b.notes,block_color:b.block_color||b.color,time_cap_seconds:b.time_cap_seconds}).eq('id',bid);if(error)throw error}for(let j=0;j<b.exercises.length;j++){const x=b.exercises[j];const p={block_id:bid,sort_order:j+1,exercise_name:x.exercise_name,reps_text:x.reps_text||null,duration_seconds:x.duration_seconds||null,side:x.side||null,video_url:x.video_url||null,coach_notes:x.coach_notes||null,load_text:x.load_text||null,tempo:x.tempo||null};if(x.id){const{error}=await sb.from('workout_exercises').update(p).eq('id',x.id);if(error)throw error}else{const{data,error}=await sb.from('workout_exercises').insert(p).select().single();if(error)throw error;x.id=data.id}}}if(status)status.textContent='✓ Salvato';}catch(e){if(status)status.textContent='Errore';alert('Salvataggio non riuscito: '+e.message)}}
function openModal(bi,ji){state.editIndex={bi,ji};document.getElementById('exerciseModal').classList.add('open');renderLibrary()}
function renderLibrary(){const q=document.getElementById('exerciseSearch').value.trim().toLowerCase();const arr=state.library.filter(x=>x.name.toLowerCase().includes(q)||String(x.category||'').toLowerCase().includes(q));document.getElementById('exerciseList').innerHTML=(arr||[]).map((x,i)=>`<div class="exercise-option" data-i="${i}"><strong>${esc(x.name)}</strong><div class="muted">${esc(x.category||'')}</div></div>`).join('')||'<div class="empty">Nessun esercizio trovato.</div>';document.querySelectorAll('.exercise-option').forEach(e=>e.onclick=()=>{const x=arr[+e.dataset.i],t=state.blocks[state.editIndex.bi].exercises[state.editIndex.ji];t.exercise_name=x.name;t.reps_text=x.default_reps_text||'';t.duration_seconds=x.default_duration_seconds||null;state.editIndex=null;document.getElementById('exerciseModal').classList.remove('open');renderEditor()})}
document.getElementById('closeModal').onclick=()=>document.getElementById('exerciseModal').classList.remove('open');document.getElementById('exerciseModal').onclick=e=>{if(e.target.id==='exerciseModal')e.currentTarget.classList.remove('open')};document.getElementById('exerciseSearch').oninput=renderLibrary;
document.querySelectorAll('.day-tab').forEach(tab=>tab.onclick=async()=>{document.querySelectorAll('.day-tab').forEach(t=>t.classList.remove('active'));tab.classList.add('active');state.day=Number(tab.dataset.day);if(state.mode==='demo'){loadDemoDay();}else if(state.selectedClient){await loadDay();}});
document.getElementById('demoBtn').onclick=()=>{state.mode='demo';state.selectedClient=demoClient;state.library=demoLibrary;document.getElementById('modeBadge').textContent='MODALITÀ PROVA — NON SALVA ONLINE';renderClients();loadDemoDay()};
function loadDemoDay(){const d=demoByDay[state.day];if(!d){state.workout={title:`GIORNO ${state.day}`,duration_minutes:50,published:false,id:'demo-'+state.day};state.blocks=[];renderEditor();return}state.workout={title:d.title,duration_minutes:d.duration_minutes,published:d.published,id:'demo-'+state.day};state.blocks=d.blocks.map((b,bi)=>({...b,id:'demo-b'+bi,exercises:b.exercises.map((x,j)=>({id:'demo-e'+bi+'-'+j,exercise_name:x[0],reps_text:x[1],duration_seconds:x[2]?Number(x[2]):null,side:'',video_url:'',coach_notes:'',load_text:'',tempo:''}))}));renderEditor()}
document.getElementById('logout').onclick=async()=>{await sb.auth.signOut();window.location.replace('coach.html')};

async function duplicatePreviousWeek(){
  if(state.mode!=='live' || !state.selectedClient) return alert('Seleziona prima un cliente.');
  if(state.week<=1) return alert('La Settimana 1 non può essere duplicata dalla precedente.');
  const fromWeek=state.week-1;
  try{
    const {data:src,error:se}=await sb.from('weekly_workouts').select('*').eq('client_id',state.selectedClient.id).eq('week_number',fromWeek).order('day_number'); if(se)throw se;
    if(!src?.length) throw new Error(`Nessun workout trovato nella Settimana ${fromWeek}.`);
    for(const old of src){
      const {data:nw,error:ne}=await sb.from('weekly_workouts').upsert({client_id:state.selectedClient.id,week_number:state.week,day_number:old.day_number,title:old.title,duration_minutes:old.duration_minutes,published:false},{onConflict:'client_id,week_number,day_number'}).select().single(); if(ne)throw ne;
      const {data:bs,error:be}=await sb.from('workout_blocks').select('*').eq('workout_id',old.id).order('sort_order'); if(be)throw be;
      await sb.from('workout_blocks').delete().eq('workout_id',nw.id);
      for(const b of (bs||[])){
        const {data:nb,error:nbe}=await sb.from('workout_blocks').insert({workout_id:nw.id,sort_order:b.sort_order,block_type:b.block_type,title:b.title,sets:b.sets,rest_seconds:b.rest_seconds,notes:b.notes,block_color:b.block_color,time_cap_seconds:b.time_cap_seconds}).select().single(); if(nbe)throw nbe;
        const {data:xs,error:xe}=await sb.from('workout_exercises').select('*').eq('block_id',b.id).order('sort_order'); if(xe)throw xe;
        if(xs?.length){const rows=xs.map(x=>({block_id:nb.id,sort_order:x.sort_order,exercise_name:x.exercise_name,reps_text:x.reps_text,duration_seconds:x.duration_seconds,side:x.side,video_url:x.video_url,coach_notes:x.coach_notes,load_text:x.load_text,tempo:x.tempo,substitution_group:x.substitution_group})); const {error:ie}=await sb.from('workout_exercises').insert(rows); if(ie)throw ie;}
      }
    }
    state.day=1; document.querySelectorAll('.day-tab').forEach(t=>t.classList.toggle('active',Number(t.dataset.day)===1)); await loadDay(); alert(`Settimana ${fromWeek} duplicata nella Settimana ${state.week}. I workout sono rimasti non pubblicati.`);
  }catch(e){alert('Duplicazione non riuscita: '+e.message)}
}
async function loadCheckins(){
  const panel=document.getElementById('checkinPanel');
  if(!state.selectedClient || state.mode!=='live'){panel.style.display='block';panel.innerHTML='<div class="muted">Seleziona un cliente in modalità Live.</div>';return;}
  panel.style.display='block'; panel.innerHTML='<div class="muted">Caricamento check-in…</div>';
  const {data,error}=await sb.from('checkins').select('*').eq('client_id',state.selectedClient.id).order('created_at',{ascending:false});
  if(error){panel.innerHTML=`<div class="error">${esc(error.message)}</div>`;return;}
  if(!data?.length){panel.innerHTML='<div class="empty">Nessun check-in ricevuto.</div>';return;}
  panel.innerHTML='<h3 style="margin-top:0">Check-in ricevuti</h3>'+data.map(c=>`<div class="panel" style="padding:14px;margin-top:10px;border-radius:14px;background:#fafafa"><div><strong>Settimana ${c.week_number}</strong> · ${new Date(c.created_at).toLocaleString('it-IT')}</div><div class="muted" style="margin-top:4px">${esc(c.feeling||'')}</div><div style="margin-top:8px">${esc(c.notes||'Nessuna nota')}</div><textarea class="field reply" data-id="${c.id}" style="margin-top:10px" placeholder="Risposta del Coach…">${esc(c.coach_reply||'')}</textarea><button class="btn blue sendReply" data-id="${c.id}" style="margin-top:8px">SALVA RISPOSTA</button></div>`).join('');
  panel.querySelectorAll('.sendReply').forEach(btn=>btn.onclick=async()=>{const id=btn.dataset.id;const ta=panel.querySelector(`.reply[data-id="${id}"]`);btn.disabled=true;try{const {error}=await sb.from('checkins').update({coach_reply:ta.value.trim()||null,replied_at:new Date().toISOString()}).eq('id',id);if(error)throw error;btn.textContent='✓ SALVATA';setTimeout(()=>btn.textContent='SALVA RISPOSTA',900)}catch(e){alert(e.message);btn.disabled=false}});
}

(async()=>{try{state.library=(await sb.from('exercise_library').select('*').eq('active',true).order('name')).data||demoLibrary;}catch(e){state.library=demoLibrary;}await loadClients();})();
const weekSelect=document.getElementById('weekSelect');if(weekSelect){for(let i=1;i<=52;i++){const o=document.createElement('option');o.value=i;o.textContent=i;weekSelect.appendChild(o)}weekSelect.value='1';weekSelect.onchange=()=>{state.week=+weekSelect.value;loadDay()}};document.getElementById('dupWeek').onclick=duplicatePreviousWeek;document.getElementById('showCheckins').onclick=loadCheckins;
</script></body></html>
