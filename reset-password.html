<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nuova password — Home Coaching</title><style>body{margin:0;background:#f5f5f7;color:#1d1d1f;font:16px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text",Arial,sans-serif}.wrap{width:min(520px,calc(100% - 32px));margin:80px auto}.card{background:#fff;border:1px solid #d2d2d7;border-radius:24px;padding:32px;box-shadow:0 20px 55px rgba(0,0,0,.07)}input{width:100%;padding:14px;border:1px solid #d2d2d7;border-radius:12px;box-sizing:border-box;margin:8px 0 14px;font:inherit}button{width:100%;padding:14px;border:0;border-radius:12px;background:#111;color:#fff;font-weight:900;cursor:pointer}h1{font-size:42px;letter-spacing:-2px}.msg{margin-top:14px;font-weight:700}.back{display:inline-block;margin-top:16px;color:#007aff;font-weight:700}</style></head><body><main class="wrap"><div class="card"><div style="font-weight:900">HOME COACHING</div><h1>Nuova password.</h1><label>Nuova password</label><input id="p1" type="password" minlength="8"><label>Conferma password</label><input id="p2" type="password" minlength="8"><button id="go">SALVA PASSWORD</button><div id="msg" class="msg"></div><a class="back" href="clienti.html">← Torna al login</a></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const sb=supabase.createClient('https://exhgrwelqwitxlfscybo.supabase.co','sb_publishable_efqq6jXmGTgdYidkIz55gw_PkwcOLH-',{auth:{persistSession:true,autoRefreshToken:true}});document.getElementById('go').onclick=async()=>{const a=document.getElementById('p1').value,b=document.getElementById('p2').value,m=document.getElementById('msg');if(a.length<8||a!==b){m.textContent='Le password devono coincidere e avere almeno 8 caratteri.';return}const {error}=await sb.auth.updateUser({password:a});if(error)m.textContent=error.message;else{m.style.color='#246536';m.textContent='Password aggiornata. Ora puoi accedere.'}};</script></body></html>
